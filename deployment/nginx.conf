# Example nginx reverse-proxy configuration for the Retail AI Platform.
# Place in /etc/nginx/conf.d/retail-ai.conf (adjust server_name / TLS).

upstream retail_ai_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name retail-ai.local;

    client_max_body_size 50M;

    location / {
        proxy_pass http://retail_ai_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Long-poll friendly settings for the dashboard
    location /api/ {
        proxy_pass http://retail_ai_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}