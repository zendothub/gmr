services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: retail_ai_postgres
    environment:
      POSTGRES_USER: retail_user
      POSTGRES_PASSWORD: retail_pass
      POSTGRES_DB: retail_ai_db
    ports:
      - "5433:5432"  # host 5433 -> container 5432 (avoids clashing with a local PostgreSQL)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail_user -d retail_ai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MediaMTX media server: ingests RTSP (pushed by the app via ffmpeg) and
  # serves it back to browsers as WebRTC (WHEP) / HLS for the zone-binding UI.
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: retail_ai_mediamtx
    environment:
      MTX_RTSPTRANSPORTS: tcp                # v1.19+ correct parameter name (replaces deprecated MTX_PROTOCOLS)
      MTX_WEBRTCADDITIONALHOSTS: 192.168.1.123,127.0.0.1
      MTX_RTSPTIMEOUT: 1h                    # Keep path alive 1 hour with zero readers (Go duration format)
      MTX_READTIMEOUT: 24h                   # TCP read timeout: 24h (Go duration format, must include unit)
      MTX_RUNONREADY: ""
      MTX_RUNONREADYRESTART: "yes"
      MTX_RUNONDEMAND: ""
    ports:
      - "8554:8554"      # RTSP (ingest + playback)
      - "8889:8889"      # WebRTC / WHEP (TCP signaling)
      - "8189:8189/udp"  # WebRTC / ICE (UDP media transport)
      - "8888:8888"      # HLS
      - "9997:9997"      # API
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retail_ai_app
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://retail_user:retail_pass@postgres:5432/retail_ai_db
      DATABASE_SYNC_URL: postgresql://retail_user:retail_pass@postgres:5432/retail_ai_db
      # Backend talks to MediaMTX by its compose service name.
      MEDIAMTX_HOST: mediamtx
      # Browser reaches WebRTC/HLS via the host - override per deployment.
      MEDIAMTX_PUBLIC_URL: ""
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      mediamtx:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata: