# Nginx reverse proxy for the Retail AI backend at api.gmr.zendot.in
# Place at: /etc/nginx/sites-available/api.gmr.zendot.in
# Enable:  sudo ln -s /etc/nginx/sites-available/api.gmr.zendot.in /etc/nginx/sites-enabled/
# TLS:     sudo certbot --nginx -d api.gmr.zendot.in   (certbot rewrites this file for HTTPS)

upstream retail_ai_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.gmr.zendot.in;

    client_max_body_size 50M;

    # API
    location / {
        proxy_pass http://retail_ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
    }

    # Health check (no logging noise)
    location = /health {
        proxy_pass http://retail_ai_backend;
        access_log off;
    }
}